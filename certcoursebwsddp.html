html:`
<div class="box story"><h4>On the Desk: One Screen, Many Eyes</h4>
<p>A trading floor has people watching prices, news, risk and positions all at once. The Degen Desk puts that view on one screen for you: prices, trends, heat maps, your lending accounts, your liquidity pools, flows, news and alerts.</p>
<p>The Desk <strong>shows</strong> you things. It never makes the decision. You do.</p></div>

<h3>Getting around</h3>
<ul>
<li>A <strong>Home button</strong> is always visible, so you can never get lost.</li>
<li>A <strong>left sidebar</strong> and <strong>top tabs</strong> take you to each tool.</li>
</ul>

<h3>What “degen” means</h3>
<p><strong>Degen</strong> is crypto slang, short for “degenerate,” for someone who takes big, high-risk bets. The name is a wink. This course teaches you to use the Desk like a professional: a plan first, then the tools.</p>

<h3>Your tools in this course</h3>

<div class="box simple"><h4>In plain words</h4>

SECS.push({id:'s2',title:'TRENDING COINS',short:'Trending',mins:9,
sub:'How to read what the crowd is watching without becoming exit liquidity.',
html:`
<div class="box story"><h4>On the Desk: The Loudest Table in the Room</h4>
<p>Walk into a casino and the loudest table is the one where somebody just won. The Trending Coins panel is that table. It lists coins that people are searching for and trading right now.</p>
<p>Loud does not mean good. By the time a coin is loud, a lot of the move may be over.</p></div>

<h3>What “trending” really measures</h3>
<p>Trending is mostly <strong>attention</strong>: searches, trading volume and social buzz. Attention can come from real news, a new listing, a celebrity post, or a coordinated pump.</p>

<h3>Four numbers to look at next to any trending coin</h3>
<ul>
<li><strong>Market cap</strong> = price × circulating supply. It tells you how big the coin really is.</li>
<li><strong>Volume</strong> = how much traded in a period. Big volume with a tiny pool of money behind it is a warning sign.</li>
<li><strong>Liquidity</strong> = how easily you can sell without moving the price. Thin liquidity means you may get stuck or lose a lot to slippage.</li>
<li><strong>Age and contract</strong> = a brand-new token is far riskier. Always confirm the <strong>contract address</strong>, because copycat tokens use the same name and ticker.</li>
</ul>

<h3>Common traps</h3>
<ul>
<li><strong>Pump and dump:</strong> insiders push the price up with hype and sell into the buyers.</li>
<li><strong>Rug pull:</strong> creators drain the liquidity or abandon the project and the token becomes worthless.</li>
<li><strong>FOMO:</strong> fear of missing out. A coin up 300 percent in a day makes you feel late and tempts you to chase.</li>
</ul>

<div class="box simple"><h4>In plain words</h4>
<p>Use Trending as a <strong>starting point for research</strong>, never as a shopping list.</p></div>

SECS.push({id:'s3',title:'THE HEAT MAP',short:'Heat Map',mins:8,
sub:'Reading the whole market in one glance: size, color, timeframe and breadth.',
html:`
<div class="box story"><h4>On the Desk: The Weather Map of Crypto</h4>
<p>A weather map shows storms and sunshine across a whole country at once. The Heat Map does the same for the market. You see in seconds whether it is a market-wide storm or just one coin having a bad day.</p></div>

<h3>How to read it</h3>
<ul>
<li><strong>Tile size</strong> usually shows market cap. Bigger tile, bigger coin.</li>
<li><strong>Tile color</strong> shows the price change over the period you choose. Green is up and red is down. A darker shade means a bigger move.</li>
<li><strong>Timeframe</strong> changes the story. One hour is mostly noise. Seven days or thirty days shows the trend.</li>
</ul>

<h3>Three useful ideas</h3>
<p><strong>Breadth.</strong> How many coins are rising compared with falling. If almost everything is red, your coin is falling with the market, which says little about the coin itself.</p>
<p><strong>Relative strength.</strong> A small green tile in a sea of red is a coin holding up better than the market. That is worth a closer look.</p>
<p><strong>Sector rotation.</strong> Money often moves from one category to another, for example from large coins into smaller ones, or from one chain’s ecosystem to another. The map shows where the heat is moving.</p>

<div class="box simple"><h4>In plain words</h4>
<p>The Heat Map tells you <strong>what already happened</strong>. It does not predict what happens next. Use it to see context before you look at a single coin.</p></div>
`,

Q('Why switch the timeframe?','One hour is mostly noise, while seven or thirty days shows the trend','Colors only work on one setting','To change the coin list','To lower fees','Different timeframes tell different stories.'),

SECS.push({id:'s4',title:'EMAs AND THE BACKTESTER',short:'EMAs',mins:12,
sub:'The 20, 50, 100 and 200 EMA, daily-close crosses, and how to test a rule honestly.',
html:`
<div class="box story"><h4>On the Desk: Gold Stars and Blue Moons</h4>
<p>On the EMA Backtester chart, a <strong>gold star</strong> marks where a rule would have bought and a <strong>blue moon</strong> marks where it would have sold. You enter a token and an amount, pick a timeframe, and see what the rule would have done in the past.</p></div>

<h3>What is an EMA?</h3>
<p>An <strong>EMA</strong> is an exponential moving average. It is the average price over a number of candles, with <strong>more weight on recent prices</strong> than a simple average gives. That makes it react faster to new moves.</p>
<table><tr><th>EMA</th><th>Think of it as</th></tr>
<tr><td>20</td><td>Short-term trend</td></tr>
<tr><td>50</td><td>Medium-term trend</td></tr>
<tr><td>100</td><td>Longer trend</td></tr>
<tr><td>200</td><td>The big-picture trend</td></tr></table>
<p>Price above a rising EMA is generally a healthier picture. Price that loses an EMA is a warning. The longer the EMA, the more important and slower the signal.</p>

<h3>Crosses and the daily close</h3>
<p>A <strong>cross</strong> happens when price or a faster EMA moves across a slower one. When the 50 crosses above the 200, traders call it a <strong>golden cross</strong>. The opposite is a <strong>death cross</strong>.</p>
<p>A <strong>daily-close cross</strong> means you wait for the daily candle to <strong>finish</strong> before calling it. A price can poke through an EMA during the day and snap back. Waiting for the close filters out many of those false alarms.</p>
<p>Timeframes matter too. Signals on the weekly and monthly charts are slower and rarer, and usually more important than signals on the 1-hour chart.</p>

<h3>Backtesting honestly</h3>
<ul>
<li><strong>The past is not a promise.</strong> A rule that worked before can fail next time.</li>
<li><strong>Count the costs.</strong> Fees and slippage reduce real results.</li>
<li><strong>Beware overfitting.</strong> If you try dozens of settings and keep the one that looked best, you fitted the past, not found an edge.</li>
<li><strong>Short history is weak evidence.</strong> A token with a few months of data cannot teach you much.</li>
</ul>

<div class="box simple"><h4>In plain words</h4>
<p>EMAs describe the trend. Backtests show how a rule behaved. Neither one tells you the future.</p></div>
`,

SECS.push({id:'s5',title:'THE LENDING ACCOUNT MANAGER',short:'Lending',mins:12,
sub:'Collateral, debt, health factor, liquidation, and how to see danger coming.',
html:`
<div class="box story"><h4>On the Desk: The Margin Call You Never Get</h4>
<p>On a lending protocol there is no person who calls you when your loan is in trouble. The code watches your numbers and, if they cross a line, a stranger’s bot closes part of your position and keeps a fee from your collateral. The Lending Account Manager is built to watch those numbers for you.</p></div>

<h3>The basics</h3>
<ul>
<li><strong>Collateral</strong> is the crypto you deposit as security.</li>
<li><strong>Debt</strong> is what you borrow, often a stablecoin.</li>
<li><strong>LTV (loan-to-value)</strong> is your debt divided by the value of your collateral.</li>
<li><strong>Liquidation</strong> happens when your debt becomes too large for your collateral. Part of your collateral is sold, and you pay a <strong>liquidation penalty</strong>.</li>
</ul>

<h3>Health factor</h3>
<p>The <strong>health factor</strong> is one number that sums it up. <strong>Above 1 is alive. At or below 1.0 your position can be liquidated.</strong> The higher the number, the bigger your cushion.</p>
<p>If your collateral falls 20 percent and your debt stays the same, your health factor falls. If your <strong>debt</strong> is in a volatile coin and that coin rises, your debt grows and your health factor falls too.</p>

<h3>Ways to raise your health factor</h3>
<ul>
<li>Add more collateral.</li>
<li>Repay part of the debt.</li>
<li>Swap volatile collateral into a stablecoin, which protects you from further price drops.</li>
</ul>
<p>All of these take time to do and cost fees, and prices can move fast. That is why you want a warning <strong>well before</strong> 1.0. A very tight alert level, such as 1.02, leaves almost no room to react.</p>

<h3>Swap windows</h3>
<p>Two decisions come up again and again: <strong>when to swap collateral</strong> into something safer, and <strong>when to swap debt</strong>. A good rule does not rely on a feeling. It uses a checklist, for example: the collateral coin has lost its 20 EMA on the weekly and monthly charts <em>and</em> your health factor is below a level you chose. When every box on your list is ticked at once, that is a swap window. You set the list. Lesson 8 shows how.</p>

<div class="box warn"><h4>Risk</h4>
<p>Borrowing against crypto keeps your upside, but it adds liquidation risk. A fast drop can liquidate you before you act. Swaps cost fees, and debt swaps into volatile coins can increase your risk. Learn the mechanics with small amounts first.</p></div>
`,
quiz:[
Q('What does a health factor at or below 1.0 mean?','Your position can be liquidated','Your position is safest','You earn more interest','Your debt is zero','Above 1 is alive, at or below 1 can be liquidated.'),

SECS.push({id:'s6',title:'FLOWS AND POSITIONING',short:'Flows',mins:11,
sub:'ETF flows, treasuries, options and futures: reading what big money is doing.',
html:`
<div class="box story"><h4>On the Desk: Following the Footprints</h4>
<p>Prices are the result. Flows and positioning are the footprints that led there. The Flow Watch panel tracks where big money is going so you can see the crowd before the crowd shows up in the price.</p></div>

<h3>ETF flows</h3>
<p>Crypto ETFs are funds that hold crypto and trade like stocks. A <strong>net inflow</strong> means more money went in than out that day, which is buying pressure. A <strong>net outflow</strong> means the opposite. Daily, weekly and monthly views help you separate a one-day blip from a trend.</p>

<h3>Treasuries</h3>
<p>Some companies and organizations hold crypto on their balance sheets. Watching the largest holders, and whether they are adding or selling, shows how committed the big players are.</p>

<h3>Options</h3>
<ul>
<li>A <strong>call</strong> option gives the right to buy at a set price. Calls are usually bullish bets.</li>
<li>A <strong>put</strong> option gives the right to sell at a set price. Puts are usually bearish bets or hedges.</li>
<li><strong>Open interest</strong> is the total number of contracts still open. The <strong>put/call ratio</strong> compares the two. A high ratio means more bearish positioning or hedging.</li>
</ul>

<h3>Futures</h3>
<p>Futures let traders bet on price using leverage. The <strong>long/short ratio</strong> shows how many are betting up versus down. When it is extremely lopsided, the crowd is crowded.</p>
<p>When price moves against a crowded side, leveraged traders get <strong>liquidated</strong>, which forces them to close. That forced selling or buying pushes price further and liquidates more people. This chain reaction is a <strong>liquidation cascade</strong>.</p>

<div class="box simple"><h4>In plain words</h4>
<p>Positioning is a gauge of crowding and conviction. It is not a guarantee. A crowded trade can stay crowded for a long time, so use it as context, not as a trigger by itself.</p></div>
`,

sub:'Liquidity pools, ranges, impermanent loss, and when to hold, rebalance or close.',
html:`
<div class="box story"><h4>On the Desk: Being the Market Maker</h4>
<p>When you swap one token for another on a decentralized exchange like Uniswap, Raydium or Aerodrome, you trade against a pool of tokens. People called <strong>liquidity providers (LPs)</strong> put those tokens in the pool and earn a share of the trading fees. The LP Position Manager helps you watch that position.</p></div>

<h3>Ranges</h3>
<p>In concentrated liquidity pools you choose a <strong>price range</strong> for your tokens.</p>
<ul>
<li><strong>In range:</strong> your liquidity is being used and you earn fees.</li>
<li><strong>Out of range:</strong> the price moved past your range. You stop earning fees and your position turns fully into one of the two tokens.</li>
</ul>
<table><tr><th>Range</th><th>Upside</th><th>Downside</th></tr>
<tr><td>Narrow</td><td>More fees per dollar while in range</td><td>Goes out of range quickly</td></tr>
<tr><td>Wide</td><td>Stays in range longer</td><td>Fewer fees per dollar</td></tr></table>

<h3>Impermanent loss</h3>
<p><strong>Impermanent loss</strong> is the difference in value between providing liquidity and simply holding the same tokens. It appears when the two token prices move apart. Fees can offset it, but not always.</p>

<h3>Hold, rebalance or close</h3>
<ul>
<li><strong>Hold</strong> when the position is in range and conditions look stable.</li>
<li><strong>Rebalance</strong> by resetting your range around the current price. It costs gas, swap fees and slippage, so doing it too often can eat your earnings.</li>
<li><strong>Close</strong> when the reason you opened the position is gone, or the risk is bigger than the fees.</li>
</ul>
<p>The manager’s Hold, Rebalance or Close meter reads market conditions and gives you a nudge. The decision is yours.</p>

<div class="box warn"><h4>Risk</h4>
<p>Pools can be hacked, tokens can collapse and impermanent loss is real. Start small, and never put in money you cannot lose.</p></div>
`,

sub:'Alerts you set yourself, at-risk accounts, swap windows, and rules that protect you from you.',
html:`
<div class="box story"><h4>On the Desk: Only the Alerts You Asked For</h4>
<p>Imagine a phone that buzzes every time anything happens anywhere. You would switch it off in a day. The right setup is the opposite: <strong>no rule, no alert, no email.</strong> Every alert comes from a rule you set, and for each rule you choose whether it only shows on the Desk screen or also lands in your email.</p></div>

<h3>How an alert rule works</h3>
<ol>
<li><strong>What</strong> to watch, such as a lending account, a coin or a pool.</li>
<li><strong>Condition</strong>, such as health factor below 1.15, or a daily close under the 20 EMA.</li>
<li><strong>Where</strong> it appears: on-screen only, or on-screen plus email.</li>
<li><strong>Cool-down</strong>, so the same alert does not repeat over and over.</li>
</ol>

<h3>Lending-market alerts you can set</h3>
<ul>
<li><strong>At-risk account:</strong> health factor falls below a level you pick, with a second, tighter “critical” level.</li>
<li><strong>Bounce from the low:</strong> health factor rises a set percent from its daily low, a sign you may have room again.</li>
<li><strong>Collateral swap window:</strong> every condition on your checklist is true at once, for example the collateral coin closed below its 20 EMA on the weekly and the monthly, and your health factor is under your comfort level.</li>
<li><strong>Debt swap window:</strong> the same idea, using a checklist you wrote for your debt.</li>
</ul>
<p>The key word is <strong>checklist</strong>. A swap window is only called when <em>all</em> the boxes you ticked are true at the same moment. It is a rule-based signal, not a prediction, and nobody can promise the “best” time.</p>

<h3>Other alerts worth having</h3>
<ul>
<li><strong>Daily-close EMA crosses</strong> on your short list of coins.</li>
<li><strong>Divergence:</strong> price makes a higher high while an indicator like RSI makes a lower high. That is a <strong>bearish divergence</strong>, a sign momentum is fading.</li>
<li><strong>Big liquidations</strong> across the market.</li>
</ul>

<h3>News, social posts and AI summaries</h3>
<p>News and social posts can move prices, and rumors spread faster than facts. Check the original source before acting. An AI summary of a post is a draft, not a fact, and it can be wrong.</p>

<h3>Rules that protect you from you</h3>
<ul>
<li><strong>Position sizing:</strong> decide how much you can lose on one idea <em>before</em> you enter.</li>
<li><strong>Pre-set exits:</strong> know where you will get out, including a stop-loss level, before you click buy.</li>
<li><strong>Leverage:</strong> it multiplies gains and losses equally.</li>
<li><strong>Write the rules down</strong> while you are calm. Emotions are loudest when money moves.</li>
</ul>

<div class="box simple"><h4>In plain words</h4>
<p>Fewer, better alerts. You set the rules, you choose which ones email you, and you stay in charge of every decision.</p></div>

<div id="rsvpStatus" aria-live="polite"></div>
<p class="privacy">Your name, email and choice are sent to Block Wall Street.</p>
</form>
<div class="pager"><button class="btn ghost" data-go="welcome">Back to start</button></div>`;
}

function mount(){
  const views=[];
  views.push(`<div class="view" id="v-welcome">${buildWelcome()}</div>`);
  SECS.forEach((s,i)=>views.push(`<div class="view" id="v-${s.id}">${buildSection(s,i)}</div>`));
  views.push(`<div class="view" id="v-final">${buildFinal()}</div>`);
  views.push(`<div class="view" id="v-join">${buildJoin()}</div>`);
  app.innerHTML=views.join('');
  $('#map').innerHTML=SECS.map((s,i)=>`<li><button data-go="${s.id}"><span class="n">${i+1}</span><span class="t">${s.title}<small>${s.sub}</small></span><span class="m">~${s.mins} min</span></button></li>`).join('')+
   `<li><button data-go="final"><span class="n">★</span><span class="t">THE FINAL EXAM<small>${FINAL.length} questions across the whole course. Pass to earn your certificate.</small></span><span class="m">~15 min</span></button></li>`;
  const pills=[['welcome','Start'],...SECS.map((s,i)=>[s.id,(i+1)+'. '+s.short]),['final','Final exam'],['join','Join the Desk']];
  $('#pills').innerHTML=pills.map(([id,l])=>`<button class="pill" data-go="${id}" data-pill="${id}">${l}</button>`).join('');
  SECS.forEach(s=>mountQuiz($('#quiz-'+s.id),s.quiz,s.id,{title:'QUIZ: '+s.short.toUpperCase(),shuffleQs:false,next:nextTarget(s.id)}));
  mountQuiz($('#quiz-final'),FINAL,'final',{title:'FINAL EXAM',shuffleQs:true,next:null,final:true});
  $('#rsvpForm').addEventListener('submit',submitRsvp);
}
function nextTarget(id){const i=SECS.findIndex(s=>s.id===id);return i<SECS.length-1?SECS[i+1].id:'final';}

function passed(key){
  if(key==='final')return state.final!==null&&state.final>=Math.ceil(FINAL.length*PASS);
  const s=SECS.find(x=>x.id===key);return s&&state.scores[key]!==undefined&&state.scores[key]>=Math.ceil(s.quiz.length*PASS);
}

function show(id,noScroll){
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+id));
  state.view=id;save();
  if(!noScroll)window.scrollTo(0,0);
  if(id==='final'){renderScores();renderCert();}
  refreshChrome();
}
function refreshChrome(){
  $$('.pill').forEach(p=>{const id=p.dataset.pill;p.classList.toggle('on',id===state.view);p.classList.toggle('done',id!=='welcome'&&id!=='join'&&passed(id));});
  const n=SECS.filter(s=>passed(s.id)).length+(passed('final')?1:0);
  $('#prog i').style.width=(n/(SECS.length+1)*100)+'%';
  const on=$('.pill.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
}
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();show(go.dataset.go);return;}
  const jp=e.target.closest('[data-jump]');
  if(jp){e.preventDefault();$('#quiz-'+jp.dataset.jump).scrollIntoView({behavior:'smooth'});}
});

/* ---- generic quiz engine ---- */
function mountQuiz(el,qs,key,opts){
  const L=['A','B','C','D'];
  let order,i,score,missed;
  function start(){order=opts.shuffleQs?shuffle(qs.map((_,k)=>k)):qs.map((_,k)=>k);i=0;score=0;missed=[];render();}
  function render(){
    if(i>=order.length)return result();
    const q=qs[order[i]];
    const opt=shuffle(q.o.map((t,k)=>({t:t,ok:k===0})));
    el.innerHTML=`<h3 class="qh">${opts.title}</h3><div class="qcount">Question ${i+1} of ${order.length} · Correct so far: ${score}</div><div class="qbar"><i style="width:${i/order.length*100}%"></i></div><div class="qq"></div><div class="opts"></div><div class="fb"></div>`;
    $('.qq',el).textContent=q.q;
    const box=$('.opts',el);
    opt.forEach((o,k)=>{
      const b=document.createElement('button');b.className='opt';
      b.innerHTML='<span class="l">'+L[k]+'</span><span></span>';
      b.lastChild.textContent=o.t;
      b.onclick=()=>pick(q,opt,k);
      box.appendChild(b);
    });
  }
  function pick(q,opt,k){
    const ok=opt[k].ok;if(ok)score++;else missed.push(q);
    $$('.opt',el).forEach((b,j)=>{b.disabled=true;if(opt[j].ok)b.classList.add('right');else if(j===k)b.classList.add('wrong');});
    const fb=$('.fb',el);
    fb.innerHTML=`<div class="why ${ok?'':'bad'}"><strong>${ok?'Correct.':'Not quite.'}</strong> <span></span></div><button class="btn" id="nx">${i<order.length-1?'Next question →':'See my score →'}</button>`;
    $('span',$('.why',fb)).textContent=q.w;
    const nx=$('#nx',fb);nx.focus({preventScroll:true});
    nx.onclick=()=>{i++;render();el.scrollIntoView({behavior:'smooth'});};
  }
  function result(){
    const total=order.length,need=Math.ceil(total*PASS),ok=score>=need;
    const prev=key==='final'?state.final:state.scores[key];
    const best=Math.max(prev||0,score);
    if(key==='final')state.final=best;else state.scores[key]=best;
    save();refreshChrome();
    if(opts.final){renderScores();renderCert();}
    const pct=Math.round(score/total*100);
    const msg=pct>=90?"Locked in. That is real knowledge.":pct>=70?"Solid work. Review what you missed below and you are there.":"No stress. Scroll up, re-read the lesson, and run it back.";
    let rev='';
    if(missed.length){rev='<div class="review"><h4>What you missed</h4>'+missed.map((q,n)=>`<details><summary>${n+1}. ${esc(q.q)}</summary><p><strong>Answer:</strong> ${esc(q.o[0])}</p><p>${esc(q.w)}</p></details>`).join('')+'</div>';}
    el.innerHTML=`<h3 class="qh">${opts.final?'EXAM':'QUIZ'} DONE</h3>
<div class="score">${score}<span style="font-size:2.2rem;color:var(--mute)"> / ${total}</span></div>
<p><span class="badge ${ok?'pass':'fail'}">${pct}% · ${ok?'PASSED':'Pass mark is '+need+' of '+total}</span> <span class="badge">Best: ${best} / ${total}</span></p>
<p style="font-size:1.1rem">${msg}</p>
<div class="row"><button class="btn ghost" id="rt">Try again</button>${opts.next?'<button class="btn" data-go="'+opts.next+'">'+(opts.next==='final'?'Go to the final exam →':'Next lesson →')+'</button>':''}</div>${rev}`;
    $('#rt',el).onclick=()=>{start();el.scrollIntoView({behavior:'smooth'});};
  }
  start();
}

/* ---- grades, email, certificate ---- */
const GRADE={
  letter(p){return p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':'F';},
  report(rows){
    let s=0,t=0;
    const out=rows.map(r=>{s+=r.score;t+=r.total;const p=Math.round(r.score/r.total*100);return {label:r.label,score:r.score,total:r.total,pct:p,letter:this.letter(p)};});
    const p=Math.round(s/t*100);
    return {rows:out,score:s,total:t,pct:p,letter:this.letter(p)};
  }
};
function certId(name,email,date,scores){
  let h=5381;const s=[name,email,date,scores.join(',')].join('|');
  for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}
  return 'DD-'+h.toString(36).toUpperCase().padStart(7,'0');
}
async function postForm(body){
  const res=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(Object.assign({access_key:WEB3_KEY},body))});
  const j=await res.json().catch(()=>({}));
  return !!(res.ok&&j.success);
}
async function submitRsvp(e){
  e.preventDefault();
  const st=$('#rsvpStatus');
  const name=$('#rName').value.trim(),email=$('#rEmail').value.trim();
  if(!name||!/^\S+@\S+\.\S+$/.test(email)){st.innerHTML='<p class="cstat bad">Please enter your name and a valid email.</p>';return;}
  st.innerHTML='<p class="cstat">Sending…</p>';
  let ok=false;
  try{ok=await postForm({subject:'Degen Desk RSVP: '+name,from_name:'BWS Degen Desk Course',name:name,email:email,plan:$('#rPlan').value,message:'Degen Desk RSVP\nName: '+name+'\nEmail: '+email+'\nChoice: '+$('#rPlan').value+'\nNote: '+($('#rNote').value||'(none)')});}catch(err){ok=false;}
  st.innerHTML=ok?'<p class="cstat ok">✓ Got it. Block Wall Street will be in touch. You can also start your subscription any time with the button above.</p>':'<p class="cstat bad">That did not go through. Check your internet and try again.</p>';
}
function renderScores(){
  const list=SECS.map((s,i)=>`<p style="margin:.3rem 0"><strong>${i+1}. ${s.short}:</strong> ${state.scores[s.id]!==undefined?state.scores[s.id]+' / '+s.quiz.length:'<span style="color:var(--mute)">not taken yet</span>'}</p>`).join('');
  const f=state.final!==null?`<p style="margin:.8rem 0 0"><strong>Final exam best:</strong> ${state.final} / ${FINAL.length}</p>`:'<p style="margin:.8rem 0 0;color:var(--mute)">Final exam not taken yet</p>';
  $('#scoreList').innerHTML=list+f;
}
function renderCert(){
  const w=$('#certWrap');
  if(!passed('final')){w.innerHTML='';return;}
  const missing=SECS.filter(s=>state.scores[s.id]===undefined);
  if(missing.length){w.innerHTML='<div class="box warn"><h4>One more step</h4><p>You passed the final exam. To get your certificate, also take the quiz for: '+missing.map(s=>esc(s.short)).join(', ')+'.</p></div>';return;}
  w.innerHTML=`<h3>Get your certificate</h3><p>You passed. Type your name and email, then tap the button. Your certificate will appear below and you can download it. Your grade for each lesson and your overall grade will be emailed to Block Wall Street.</p>
<div class="row"><input class="nameIn" id="nameIn" placeholder="Your name" aria-label="Your name" autocomplete="name"><input class="nameIn" id="emailIn" type="email" placeholder="Your email (optional)" aria-label="Your email" autocomplete="email"></div>
<div class="row" style="margin-top:0"><button class="btn" id="mkCert">Make my certificate</button></div>
<p class="privacy">When you make your certificate, your name, email and scores are sent to Block Wall Street.</p>
<div id="certStatus" aria-live="polite"></div><div id="certOut"></div>${ctaBlock()}`;
  $('#nameIn').value=state.name||'';$('#emailIn').value=state.email||'';
  $('#mkCert').onclick=makeCert;
}
function today(){return new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});}
async function makeCert(){
  const st=$('#certStatus');
  const name=($('#nameIn').value||'').trim(),email=($('#emailIn').value||'').trim();
  if(!name){st.innerHTML='<p class="cstat bad">Please type your name first.</p>';$('#nameIn').focus();return;}
  if(email&&!/^\S+@\S+\.\S+$/.test(email)){st.innerHTML='<p class="cstat bad">That email does not look right. Fix it or leave it empty.</p>';return;}
  state.name=name;state.email=email;if(!state.certDate)state.certDate=today();save();
  const rows=SECS.map(s=>({label:s.short,score:state.scores[s.id],total:s.quiz.length})).concat([{label:'Final exam',score:state.final,total:FINAL.length}]);
  const rep=GRADE.report(rows);
  const id=certId(name,email,state.certDate,rows.map(r=>r.score));
  await drawCertificate(name,rep,id,state.certDate);
  const sig=JSON.stringify([name,email,rows.map(r=>r.score)]);
  if(state.sentSig===sig){st.innerHTML='<p class="cstat ok">✓ Your grades were already emailed to Block Wall Street.</p>';return;}
  st.innerHTML='<p class="cstat">Sending your grades to Block Wall Street…</p>';
  const lines=rep.rows.map(r=>r.label+': '+r.score+'/'+r.total+' = '+r.pct+'% ('+r.letter+')').join('\n');
  let ok=false;
  try{ok=await postForm(Object.assign({
    subject:'Course completed: '+name+' | '+COURSE_NAME+' | '+rep.pct+'% ('+rep.letter+')',
    from_name:'BWS Course Report',name:name,course:COURSE_NAME,overall_grade:rep.pct+'% ('+rep.letter+')',
    message:'Participant: '+name+'\nEmail: '+(email||'(not given)')+'\nCourse: '+COURSE_NAME+'\nCompleted: '+state.certDate+'\nCertificate ID: '+id+'\n\nSECTION GRADES\n'+lines+'\n\nOVERALL GRADE: '+rep.score+'/'+rep.total+' = '+rep.pct+'% ('+rep.letter+')\n\nGrades use the participant\'s best score on each quiz. Pass mark is 70%.'
  },email?{email:email}:{}));}catch(err){ok=false;}
  if(ok){state.sentSig=sig;save();st.innerHTML='<p class="cstat ok">✓ Your lesson grades and overall grade were emailed to Block Wall Street.</p>';}
  else{st.innerHTML='<p class="cstat bad">Your certificate is ready, but the email did not go through. Check your internet and tap the button again.</p>';}
}
async function drawCertificate(name,rep,id,date){
  try{await Promise.all([document.fonts.load('800 100px "Inter"'),document.fonts.load('26px "DM Mono"'),document.fonts.load('30px "Inter"')]);}catch(e){}
  const W=1754,H=1240,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const cs=getComputedStyle(document.documentElement);
  const A=(cs.getPropertyValue('--a')||'#35F0FF').trim(),HI=(cs.getPropertyValue('--a-hi')||'#8CF7FF').trim();
  const TEXT='#E6ECFA',MUTE='#8E9BC0',LINE='#1F2D52';
  const SANS='"Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif',MONO='"DM Mono",Consolas,monospace';
  const f=(w,px)=>w+' '+px+'px '+SANS;
  const fit=(t,maxW,px,w)=>{let s=px;do{x.font=f(w||800,s);s-=2;}while(x.measureText(t).width>maxW&&s>20);};
  const bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0B1429');bg.addColorStop(1,'#070D1B');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  x.strokeStyle=A;x.lineWidth=6;x.strokeRect(40,40,W-80,H-80);
  x.lineWidth=2;x.strokeStyle=LINE;x.strokeRect(62,62,W-124,H-124);
  x.textAlign='center';x.fillStyle=A;x.font='26px '+MONO;
  if('letterSpacing' in x)x.letterSpacing='8px';
  x.fillText('BLOCK WALL STREET  ·  DEGEN DESK',W/2,135);
  if('letterSpacing' in x)x.letterSpacing='0px';
  const T='CERTIFICATE OF COMPLETION';x.fillStyle=TEXT;fit(T,1450,104);x.fillText(T,W/2,255);
  x.fillStyle=MUTE;x.font=f(400,30);x.fillText('This certifies that',W/2,335);
  x.fillStyle=HI;fit(name,1300,120);x.fillText(name,W/2,455);
  x.strokeStyle=A;x.lineWidth=2;x.beginPath();x.moveTo(W/2-500,485);x.lineTo(W/2+500,485);x.stroke();
  x.fillStyle=MUTE;x.font=f(400,30);x.fillText('has successfully completed',W/2,545);
  x.fillStyle=TEXT;const C='The Degen Desk Course';fit(C,1200,66);x.fillText(C,W/2,615);
  const secRows=rep.rows.slice(0,SECS.length),colW=720,gap=80,startX=W/2-colW-gap/2,top=705,rh=44;
  x.font='26px '+MONO;
  secRows.forEach((r,i)=>{
    const col=i<4?0:1,row=i%4,lx=startX+col*(colW+gap),y=top+row*rh;
    x.textAlign='left';x.fillStyle=TEXT;x.fillText((i+1)+'  '+r.label,lx,y);
    x.textAlign='right';x.fillStyle=HI;x.fillText(r.score+'/'+r.total+'   '+r.pct+'%  '+r.letter,lx+colW,y);
    x.strokeStyle=LINE;x.lineWidth=1;x.beginPath();x.moveTo(lx,y+12);x.lineTo(lx+colW,y+12);x.stroke();
  });
  const fin=rep.rows[rep.rows.length-1];
  x.textAlign='center';x.fillStyle=TEXT;x.font='32px '+MONO;
  x.fillText('Final exam: '+fin.score+'/'+fin.total+'  '+fin.pct+'%  ('+fin.letter+')',W/2,top+4*rh+34);
  const ov='OVERALL GRADE  '+rep.pct+'%  ('+rep.letter+')';
  x.fillStyle=A;fit(ov,1300,96);x.fillText(ov,W/2,top+4*rh+140);
  x.fillStyle=MUTE;x.font='26px '+MONO;
  x.textAlign='left';x.fillText('Date: '+date,120,H-150);
  x.fillText('Certificate ID: '+id,120,H-112);
  x.textAlign='right';x.fillStyle=A;x.font=f(800,34);
  x.fillText('BLOCK WALL STREET',W-120,H-148);
  x.fillStyle=MUTE;x.font='24px '+MONO;x.fillText('Chicago, IL  ·  blockwallstreet.biz',W-120,H-112);
  x.textAlign='center';x.fillStyle='#6b7799';x.font=f(400,20);
  x.fillText('Education only. Not financial advice.',W/2,H-88);
  const url=c.toDataURL('image/png');
  const fname='Degen_Desk_Certificate_'+name.replace(/[^A-Za-z0-9]+/g,'_')+'.png';
  $('#certOut').innerHTML='<img id="certImg" alt="Certificate of completion for '+esc(name)+'" src="'+url+'">'+
   '<div class="row"><a class="btn" id="dlCert" href="'+url+'" download="'+fname+'">Download certificate (PNG)</a><button class="btn ghost" id="prCert">Print or save as PDF</button></div>';
  $('#prCert').onclick=()=>window.print();
}


/* ---- accent: same three accents and same saved choice as the Desk (bwsDesk.theme) ---- */
const THEMES=[['cyan','Cyan'],['gold','Gold'],['violet','Violet']];
function getTheme(){try{const t=localStorage.getItem('bwsDesk.theme');if(THEMES.some(x=>x[0]===t))return t;}catch(e){}return 'cyan';}
function setTheme(t,saveIt){document.documentElement.setAttribute('data-theme',t);const b=document.getElementById('themeBtn');if(b)b.textContent='Accent: '+THEMES.find(x=>x[0]===t)[1];if(saveIt){try{localStorage.setItem('bwsDesk.theme',t);}catch(e){}}}
(function(){const b=document.getElementById('themeBtn');setTheme(getTheme(),false);if(b)b.onclick=()=>{const i=THEMES.findIndex(x=>x[0]===getTheme());setTheme(THEMES[(i+1)%3][0],true);};})();

/* ---- toolbar ---- */
function applyPrefs(){
  document.documentElement.style.fontSize=state.fs+'px';
}
$('#fsm').onclick=()=>{state.fs=Math.max(14,state.fs-1);applyPrefs();save();};
$('#fsp').onclick=()=>{state.fs=Math.min(28,state.fs+1);applyPrefs();save();};

mount();applyPrefs();
show(state.view&&$('#v-'+state.view)?state.view:'welcome',true);
</script>
