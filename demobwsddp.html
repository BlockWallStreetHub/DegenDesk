  --brass:#caa24a; --brass-hi:#f1d98a; --amber:#ffb347; --tape:#eadfc4; --mute:#9fb3a6; --faint:#6f857a;
  --up:#52d39a; --down:#e5584c; --gold:#e8c35a;
  --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,Segoe UI,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--floor);color:var(--tape);font-family:var(--body);font-size:15.5px;line-height:1.5;min-height:100vh}
a{color:var(--brass-hi)}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:8px 18px;background:#030a07;border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:9px;color:var(--tape);text-decoration:none;line-height:1;white-space:nowrap}
.brand svg{width:32px;height:auto}
.pill{background:var(--amber);color:#1a1405;font-family:var(--disp);font-weight:900;letter-spacing:.08em;padding:3px 9px;border-radius:4px;font-size:15px;line-height:1.1}
.tapes{flex:1;overflow:hidden;white-space:nowrap;font-family:var(--mono);font-size:12.5px;min-width:0;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.tapes .trk{display:inline-block;animation:tp 60s linear infinite}
.tapes span{padding:0 16px}.tapes b{color:var(--amber);font-weight:500;margin-right:6px}
@keyframes tp{to{transform:translateX(-50%)}}
.tb{background:none;border:1px solid var(--line2);border-radius:6px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
.tb:hover{border-color:var(--brass)}
.tb .n{background:var(--down);color:#fff;border-radius:9px;font-size:11px;padding:1px 6px;margin-left:5px}
.tb.go{background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#1a1405;border:0;font-weight:600;text-decoration:none;display:inline-block}
.banner{background:#2a1f08;border-bottom:1px solid #5a4614;color:#f3dfa6;padding:8px 18px;font-size:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.banner button{background:none;border:1px solid #8a6d22;border-radius:5px;padding:3px 10px;font-size:13px;color:#f3dfa6}

.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 100px)}
nav{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:50px;align-self:start;height:calc(100vh - 100px);overflow:auto}
nav h6{font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin:14px 8px 4px}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:7px 8px;font-size:14.5px;color:#c0cfc5;border-radius:0 5px 5px 0}
nav button:hover{background:var(--panel)}
nav button.cur{background:var(--board);border-left-color:var(--brass);color:var(--tape)}
nav .lk{font-size:11px;color:var(--faint)}
main{padding:22px 3vw 70px;min-width:0}
.vh h2{font-family:var(--disp);font-weight:900;font-size:clamp(30px,4vw,46px);text-transform:uppercase;line-height:1}
.vh p{color:var(--mute);max-width:70ch;margin:6px 0 18px;font-size:14.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:10px 12px}
.card small{display:block;color:var(--faint);font-size:12px}
.card b{font-family:var(--mono);font-weight:500;font-size:19px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.box{background:var(--panel);border:1px solid var(--line2);border-top:3px solid var(--brass);border-radius:0 0 6px 6px;padding:12px 14px}
.box h3{font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.box h3 a{font-family:var(--body);font-size:12.5px;font-weight:500;text-transform:none;letter-spacing:0;cursor:pointer}
.li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border:0}
.mono{font-family:var(--mono)}
.up{color:var(--up)!important}.dn{color:var(--down)!important}.gd{color:var(--gold)!important}.mu{color:var(--faint)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:4px;border:1px solid var(--line2);margin-right:6px;white-space:nowrap}
.tag.high{border-color:var(--down);color:var(--down)}.tag.med{border-color:var(--gold);color:var(--gold)}.tag.low{color:var(--mute)}
.tag.ok{border-color:var(--up);color:var(--up)}.tag.cau{border-color:var(--gold);color:var(--gold)}.tag.dng{border-color:var(--down);color:var(--down)}
.btn{display:inline-block;padding:9px 16px;border:0;border-radius:6px;background:linear-gradient(180deg,var(--brass-hi),var(--brass));color:#1a1405;font-family:var(--disp);font-weight:900;font-size:17px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;line-height:1.1}
.btn.ghost{background:none;border:1.5px solid var(--brass);color:var(--brass-hi)}
.chip{background:#0a1a13;border:1px solid var(--line2);border-radius:6px;padding:6px 12px;font-size:13.5px;color:#c9d6cc}
.chip:hover{border-color:var(--brass)}.chip.on{background:var(--brass);border-color:var(--brass);color:#1a1405;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:10px 0}
select,input[type=text]{background:#050f0a;color:var(--tape);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;font:inherit;font-size:14px}
input[type=range]{accent-color:var(--brass);width:min(100%,360px)}
.note{font-size:13px;color:var(--faint)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--faint);font-weight:500;padding:7px 9px;border-bottom:1px solid var(--line2);font-size:12.5px;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13.5px;white-space:nowrap}
td.t{font-family:var(--body)}
tr.sel td{background:#0e2a22}
tbody tr.cl{cursor:pointer}tbody tr.cl:hover td{background:#0a1d15}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line2);border-radius:6px}
canvas{width:100%;height:260px;display:block;background:#050f0a;border:1px solid var(--line);border-radius:4px}
.gauge{height:8px;background:#12281e;border-radius:4px;position:relative;min-width:120px}
.gauge i{position:absolute;top:-3px;width:4px;height:14px;border-radius:2px;background:var(--tape)}
.gauge u{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--faint)}
.heat{display:flex;flex-wrap:wrap;gap:3px;min-height:260px}
.tile{flex:1 1 var(--w,20%);min-width:90px;min-height:78px;padding:8px 10px;border-radius:4px;display:flex;flex-direction:column;justify-content:space-between;color:#06120d;border:0;text-align:left}
.tile b{font-family:var(--disp);font-weight:800;font-size:22px;line-height:1}.tile span{font-family:var(--mono);font-size:13px;font-weight:500}
.hp{margin-top:12px;padding:10px 14px;background:#0a1a13;border-left:4px solid var(--brass);border-radius:4px;font-size:14.5px}
.hp.good{border-color:var(--up)}.hp.bad{border-color:var(--down)}
.tour{display:grid;gap:8px}
.tour button{text-align:left;background:#0a1a13;border:1px solid var(--line2);border-radius:6px;padding:9px 12px;font-size:14px}
.tour button:hover{border-color:var(--brass)}
.feed{position:fixed;top:50px;right:0;bottom:0;width:min(380px,100%);background:#050f0a;border-left:1px solid var(--line2);z-index:40;transform:translateX(100%);transition:transform .25s;padding:14px;overflow:auto}
.feed.open{transform:none}
.feed h3{font-family:var(--disp);font-weight:900;font-size:24px;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.al{border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}.al small{display:block;color:var(--faint);font-size:12px}
dialog{background:var(--panel);color:var(--tape);border:1px solid var(--brass);border-radius:10px;padding:24px;max-width:460px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h3{font-family:var(--disp);font-weight:900;font-size:28px;text-transform:uppercase;margin-bottom:8px}
dialog p{color:#c9d6cc;margin-bottom:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0e2a22;border:1px solid var(--brass);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:92vw}
#menuBtn{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav{display:none;position:fixed;top:50px;left:0;right:0;bottom:0;z-index:35;height:auto;background:var(--floor)}
  nav.open{display:block}
  #menuBtn{display:inline-block}
  .tapes{display:none}.top{gap:8px}
}
@media (prefers-reduced-motion:reduce){.tapes .trk{animation:none}.feed{transition:none}}
@media(max-width:700px){input,select,textarea{font-size:16px !important}button,.btn,a.btn{min-height:40px}}
@media(max-width:900px){.top{overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none;padding-left:12px;padding-right:12px}.top::-webkit-scrollbar{display:none}.top>*{flex-shrink:0}.top .brand svg{display:none}.top .brand{font-size:17px}.top .sp{flex:1 0 8px}.tape,.tapes{display:none}.bar{display:none}}
</style>

<script>
var JOIN_URL="https://buy.stripe.com/5kQ28t4vu3mvfPEabe2sM0y";
const $=i=>document.getElementById(i);
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
['joinTop','dj'].forEach(i=>$(i).href=JOIN_URL);

/* ================= demo data (all made up) ================= */
const COINS=[['BTC',95000],['ETH',3400],['SOL',190],['BNB',620],['XRP',2.4],['DOGE',.21],['AVAX',38],['LINK',19],['ADA',.72],['SUI',3.6],['DOT',7.1],['TON',5.9]];
const BASE={};COINS.forEach(c=>BASE[c[0]]=c[1]);
const jit={};COINS.forEach(c=>jit[c[0]]=0);
let shock=0;                         // market move in percent, set by the slider in Liquidation Manager
const mult=()=>1+shock/100;
const price=s=>BASE[s]*(1+jit[s])*mult();
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TF={D:{n:420,per:[20,50,100,200],u:'day',name:'Daily'},W:{n:300,per:[20,50,100,200],u:'week',name:'Weekly'},M:{n:70,per:[6,12,18,24],u:'month',name:'Monthly'}};
const cache={};
function ser(sym,tf){
  const k=sym+tf;if(cache[k])return cache[k];
  let seed=0;for(const ch of k)seed=seed*31+ch.charCodeAt(0);
  const r=rng(seed),n=TF[tf].n;let p=100,a=[],drift=0,vol=.02;
  for(let i=0;i<n;i++){if(i%45===0){drift=(r()-.45)*.007;vol=.012+r()*.02}p*=1+drift+(r()-.5)*2*vol;a.push(p)}
  const sc=BASE[sym]/a[n-1];a=a.map(v=>v*sc);return cache[k]=a;
}
function ema(a,n){const o=new Array(a.length).fill(null);let s=0;for(let i=0;i<n;i++)s+=a[i];let e=s/n;o[n-1]=e;const k=2/(n+1);for(let i=n;i<a.length;i++){e=a[i]*k+e*(1-k);o[i]=e}return o}
const fmt=p=>p>=1000?p.toLocaleString(undefined,{maximumFractionDigits:0}):p>=10?p.toFixed(2):p>=1?p.toFixed(3):p.toFixed(4);
const pct=(x,d=1)=>(x>=0?'+':'')+x.toFixed(d)+'%';
const money=x=>'$'+Math.round(x).toLocaleString();

/* demo Aave accounts: collateral [asset, amount, liquidation threshold], debt in USD */
const ACCTS=[
 {n:'Demo Wallet A',net:'Ethereum',type:'Wallet',addr:'0xDEMO…0001',col:[['ETH',10,.825],['BTC',.3,.78]],debt:18000},
 {n:'Demo DSA B',net:'Avalanche',type:'Instadapp DSA',addr:'0xDEMO…0002',col:[['AVAX',400,.70]],debt:7500},
 {n:'Demo Wallet C',net:'Arbitrum',type:'Wallet',addr:'0xDEMO…0003',col:[['ETH',6,.825]],debt:10500}
];
const CAUTION=1.5,DANGER=1.25;
function hf(a){const c=a.col.reduce((s,x)=>s+x[1]*price(x[0])*x[2],0);return c/a.debt}
function collat(a){return a.col.reduce((s,x)=>s+x[1]*price(x[0]),0)}
const stat=h=>h<DANGER?['Danger','dng']:h<CAUTION?['Caution','cau']:['Safe','ok'];
let lastStat={};

const STABLES=[['USDT',1.0002],['USDC',.9999],['DAI',1.0004],['USDe',.9991],['PYUSD',1.0001]];
let usdx=1.0;
const pegStat=p=>{const a=Math.abs(p-1)*100;return a<=.3?['Green','up']:a<=1?['Gold','gd']:['Red','dn']};

const NEWS=[
 ['A lending protocol is exploited for $40 million, withdrawals paused','Security','high','bear','12 min ago'],
 ['A major stablecoin briefly trades below $0.99 on thin weekend volume','Security','high','bear','1 hr ago'],
 ['Fed holds rates steady, signals it is watching inflation data closely','Macro','med','bear','2 hr ago'],
 ['Regulator delays decision on a spot ETF application','Regulation','med','bear','3 hr ago'],
 ['A top exchange will list a new layer 1 token on Friday','Listing','low','bull','5 hr ago'],
 ['Large token unlock scheduled for next week, about 2% of supply','Unlock','low','bear','7 hr ago'],
 ['Asset manager reports record inflows into its crypto fund','Flows','low','bull','9 hr ago'],
 ['Developers ship long-awaited network upgrade on testnet','Tech','low','bull','11 hr ago']
];
const TRENDS=[['MOON1','Solana',12000,'+240%'],['PUPX','Base',48000,'+95%'],['DEGA','Ethereum',160000,'+61%'],['VLTA','Arbitrum',420000,'+38%'],['RELY','Base',900000,'+22%'],['NOVA','Solana',2300000,'+17%'],['GRID','Ethereum',5400000,'+12%'],['PRIM','Avalanche',11800000,'+8%']];
const HEAT=[['BTC',30],['ETH',22],['SOL',12],['BNB',10],['XRP',8],['DOGE',5],['ADA',4],['AVAX',3],['LINK',3],['SUI',2],['DOT',2],['TON',2]];
const HV={'1H':[.4,-.2,1.1,.3,-.6,.9,-1.4,.2,.1,-.3,2.1,-.8],'24H':[2.1,-1.4,4.8,1.2,-3.6,5.2,-6.1,.7,2.4,-.9,9.5,-4.2],'7D':[6.5,3.2,-8.4,12.1,-2.2,9.9,-14.6,4.4,-6.8,1.1,22.5,-11.9],'30D':[18,-9.5,25,-21,7.4,31,-38,12,-4.5,16,55,-27]};

const NAV=[['Desk',[['ovr','Overview']]],['Risk',[['liq','Liquidation Manager'],['peg','Stablecoin Pegs'],['port','Portfolio Simulator',1]]],['Alerts',[['ind','Indicators']]],['Markets',[['trend','Trending Coins'],['heat','Heat Map'],['sig','Signal Scanner'],['bt','EMA Backtester',1]]],['Intel',[['news','News']]],['Build',[['sim','Accumulation Sim',1]]]];
const LOCK={port:['Portfolio Simulator','Project your holdings and your Aave accounts to a future date under price moves you choose, and see your lowest health factor on the way.'],bt:['EMA Backtester','Test buying and selling on the 20, 50, 100 or 200 EMA for any ticker or contract address, 1 hour to monthly, and compare it to just holding.'],sim:['Accumulation Sim','Feed the Machine: model regular deposits into BTC, ETH and USDC on Aave and what 30% borrowing against the stack would look like.']};

/* ================= alerts ================= */
let alerts=[],unread=0;
const stamp=()=>new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
function pushAlert(kind,msg,quiet){
  alerts.unshift({kind,msg,t:stamp()});if(alerts.length>40)alerts.pop();
  if(!quiet){unread++;}
  drawFeed();
}
function drawFeed(){
  $('fl').innerHTML=alerts.length?alerts.map(a=>`<div class="al"><span class="tag ${a.kind==='Health factor'||a.kind==='Peg'?'high':'med'}">${a.kind}</span>${a.msg}<small>${a.t} &middot; demo alert</small></div>`).join(''):'<p class="note" style="margin-top:12px">No alerts yet. Try the market slider in Liquidation Manager.</p>';
  const n=$('feedN');n.hidden=!unread;n.textContent=unread;
}
$('feedBtn').onclick=()=>{$('feed').classList.toggle('open');if($('feed').classList.contains('open')){unread=0;drawFeed()}};
$('feedX').onclick=()=>$('feed').classList.remove('open');
$('clr').onclick=()=>{alerts=[];drawFeed()};
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(()=>e.hidden=true,2600)}
function checkAccts(){
  ACCTS.forEach(a=>{const h=hf(a),s=stat(h)[0],l=lastStat[a.n];
    if(l&&l!==s){
      if(s==='Danger')pushAlert('Health factor',`<b>${a.n}</b> (${a.net}): health factor ${h.toFixed(2)} is below your danger line (${DANGER.toFixed(2)}).`);
      else if(s==='Caution')pushAlert('Health factor',`<b>${a.n}</b> (${a.net}): health factor ${h.toFixed(2)} is below your caution line (${CAUTION.toFixed(2)}).`);
      else if(l!=='Safe'&&s==='Safe')pushAlert('Health factor',`<b>${a.n}</b> is back above your caution line (${h.toFixed(2)}).`);
    }
    lastStat[a.n]=s});
}

/* ================= charts ================= */
function chart(cv,a,lines,sel,label){
  const dpr=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const st=Math.max(0,a.length-160),v=a.slice(st);let lo=Infinity,hi=-Infinity;v.forEach(x=>{lo=Math.min(lo,x);hi=Math.max(hi,x)});
  const X=i=>8+(i-st)*(w-16)/(a.length-1-st),Y=x=>h-14-(x-lo)/(hi-lo)*(h-28);
  g.strokeStyle='#14281e';for(let k=1;k<5;k++){g.beginPath();g.moveTo(0,k*h/5);g.lineTo(w,k*h/5);g.stroke()}
  const cols=['#fcd34d','#caa24a','#f472b6','#7dd3fc'];
  lines.forEach((e,j)=>{if(j===sel)return;g.beginPath();let on=false;for(let i=st;i<a.length;i++){const x=e[i];if(x==null){on=false;continue}on?g.lineTo(X(i),Y(x)):g.moveTo(X(i),Y(x));on=true}g.strokeStyle=cols[j];g.lineWidth=1.2;g.stroke()});
  g.beginPath();for(let i=st;i<a.length;i++){i===st?g.moveTo(X(i),Y(a[i])):g.lineTo(X(i),Y(a[i]))}g.strokeStyle='#eadfc4';g.lineWidth=1.6;g.stroke();
  const e=lines[sel];g.beginPath();let on=false;for(let i=st;i<a.length;i++){const x=e[i];if(x==null){on=false;continue}on?g.lineTo(X(i),Y(x)):g.moveTo(X(i),Y(x));on=true}g.strokeStyle='#fb923c';g.lineWidth=2.8;g.stroke();
  g.font='12px "IBM Plex Mono",monospace';g.fillStyle='#9fb3a6';g.fillText(label,10,16);
}

/* ================= views ================= */
let cur='ovr',sigTf='D',sigEma=0,sigNear=false,sigPick='BTC',heatP='24H',heatM='cap',trendMin=0,trendChain='All chains',newsLvl='all';
const V={};

V.ovr=()=>{

  const pg=STABLES.concat([['USDX',usdx]]).map(s=>{const p=pegStat(s[1]);return `<div class="li"><span>${s[0]}</span><span class="mono ${p[1]}">${s[1].toFixed(4)}</span></div>`}).join('');

   <div class="box"><h3>Stablecoin pegs <a data-go="peg">Open</a></h3>${pg}</div>

  </div>`;

V.liq=()=>{
  const rows=ACCTS.map(a=>{const h=hf(a),s=stat(h),buf=h>1?(1-1/h)*100:0;
    return `<tr><td class="t">${a.n}</td><td class="t">${a.net}</td><td class="t">${a.type}</td><td>${a.addr}</td><td>${money(collat(a))}</td><td>${money(a.debt)}</td><td class="${s[1]==='ok'?'up':s[1]==='cau'?'gd':'dn'}"><b>${h.toFixed(2)}</b></td><td>${buf.toFixed(0)}%</td><td class="t"><span class="tag ${s[1]}">${s[0]}</span></td></tr>`}).join('');
  return `<div class="vh"><h2>Liquidation Manager</h2><p>Watches Aave V3 positions on Ethereum, Arbitrum, Base, Optimism and Avalanche. Read-only: in the real desk you paste a public address, never a seed phrase or private key. These three accounts are made up.</p></div>
  <div class="box" style="margin-bottom:14px"><h3>Market move</h3><p class="note">Drag to make every crypto price in this demo rise or fall. Health factor is collateral value times liquidation threshold, divided by debt. At 1.00 the position can be liquidated.</p>
   <div class="row"><input type="range" id="shk" min="-50" max="30" step="1" value="${shock}"><b class="mono" id="shv">${pct(shock,0)}</b><button class="chip" id="shr">Reset to 0%</button></div></div>
  <div class="tw"><table><thead><tr><th>Name</th><th>Network</th><th>Type</th><th>Address</th><th>Collateral</th><th>Debt</th><th>Health factor</th><th>Can fall</th><th>Status</th></tr></thead><tbody id="lb">${rows}</tbody></table></div>
  <div class="row"><span class="note">Your alert lines in this demo: caution below ${CAUTION.toFixed(2)}, danger below ${DANGER.toFixed(2)}. "Can fall" is how far all collateral can drop before liquidation.</span></div>
  <div class="row"><button class="chip" id="addA">Add an account</button><button class="chip" id="chan">Set up alert channels</button></div>
  <div class="hp" id="lh"></div>`;
};
V.liq.after=()=>{
  const upd=()=>{
    shock=+$('shk').value;$('shv').textContent=pct(shock,0);
    const rows=ACCTS.map(a=>{const h=hf(a),s=stat(h),buf=h>1?(1-1/h)*100:0;
      return `<tr><td class="t">${a.n}</td><td class="t">${a.net}</td><td class="t">${a.type}</td><td>${a.addr}</td><td>${money(collat(a))}</td><td>${money(a.debt)}</td><td class="${s[1]==='ok'?'up':s[1]==='cau'?'gd':'dn'}"><b>${h.toFixed(2)}</b></td><td>${buf.toFixed(0)}%</td><td class="t"><span class="tag ${s[1]}">${s[0]}</span></td></tr>`}).join('');
    $('lb').innerHTML=rows;checkAccts();
    const worst=Math.min(...ACCTS.map(hf));
    $('lh').className='hp '+(worst<DANGER?'bad':worst<CAUTION?'':'good');
    $('lh').textContent=worst<1?'At least one account would be liquidated at this price. The alert feed shows what the real desk would have sent you.':worst<DANGER?'An account is in the danger zone. This is where the real desk sends repeated alerts until you add collateral or repay debt.':worst<CAUTION?'An account crossed your caution line. You would get an alert here, with time to act.':'All accounts are above your caution line.';
  };
  $('shk').oninput=upd;$('shr').onclick=()=>{$('shk').value=0;upd()};
  $('addA').onclick=()=>toast('In the real desk you paste a public address here. Never a seed phrase.');
  $('chan').onclick=()=>toast('The real desk sends alerts to Telegram, Discord, WhatsApp, email and phone.');
  upd();
};

V.peg=()=>{
  const all=STABLES.concat([['USDX (demo)',usdx]]);
  const rows=all.map(s=>{const p=pegStat(s[1]),off=(s[1]-1)*100,pos=50+Math.max(-100,Math.min(100,off*50))/2;
    return `<tr><td class="t">${s[0]}</td><td>$${s[1].toFixed(4)}</td><td class="${p[1]}">${pct(off,2)}</td><td style="min-width:150px"><div class="gauge"><u></u><i style="left:${pos}%"></i></div></td><td class="t ${p[1]}"><b>${p[0]}</b></td></tr>`}).join('');
  return `<div class="vh"><h2>Stablecoin Pegs</h2><p>A stablecoin that slips off $1 is often the first warning that your collateral or debt is not worth what Aave thinks. Green is within 0.3%, gold is 0.3% to 1%, red is more than 1%.</p></div>
  <div class="tw"><table><thead><tr><th>Coin</th><th>Price</th><th>Off peg</th><th>Gauge</th><th>Status</th></tr></thead><tbody id="pb">${rows}</tbody></table></div>
  <div class="box" style="margin-top:14px"><h3>Move USDX</h3><div class="row"><input type="range" id="usd" min="0.97" max="1.03" step="0.001" value="${usdx}"><b class="mono" id="usv">$${usdx.toFixed(3)}</b><button class="chip" id="dep">Simulate a depeg</button><button class="chip" id="usr">Back to $1.000</button></div></div>`;
};
V.peg.after=()=>{
  const draw=()=>{const k=$('stage');k.querySelector('#pb').parentElement.parentElement.outerHTML=V.peg().match(/<div class="tw">[\s\S]*?<\/table><\/div>/)[0];};
  const set=(v,fire)=>{const was=pegStat(usdx)[0];usdx=v;go('peg',true);if(fire||pegStat(v)[0]!==was){const p=pegStat(v);if(p[0]==='Red')pushAlert('Peg',`<b>USDX</b> is at $${v.toFixed(4)}, ${pct((v-1)*100,2)} off its peg. Check your health factors and the news.`);else if(p[0]==='Gold'&&was==='Green')pushAlert('Peg',`<b>USDX</b> slipped to $${v.toFixed(4)}. Worth watching.`)}};
  $('usd').oninput=e=>{usdx=+e.target.value;$('usv').textContent='$'+usdx.toFixed(3);const t=V.peg();$('pb').innerHTML=t.match(/<tbody id="pb">([\s\S]*?)<\/tbody>/)[1]};
  $('usd').onchange=e=>{const p=pegStat(+e.target.value);if(p[0]==='Red')pushAlert('Peg',`<b>USDX</b> is at $${(+e.target.value).toFixed(4)}, ${pct((+e.target.value-1)*100,2)} off its peg. Check your health factors and the news.`);else if(p[0]==='Gold')pushAlert('Peg',`<b>USDX</b> slipped to $${(+e.target.value).toFixed(4)}. Worth watching.`)};
  $('dep').onclick=()=>set(.984,true);$('usr').onclick=()=>set(1,false);
};

function sigRows(){
  const T=TF[sigTf];
  return COINS.map(c=>{
    const s=c[0],cl=ser(s,sigTf),es=T.per.map(p=>ema(cl,p)),last=cl.length-1,p=price(s);
    const e=es[sigEma][last],d=(p/e-1)*100;
    let sc=0;es.forEach(x=>sc+=p>x[last]?1:-1);sc+=es[1][last]>es[3][last]?1:-1;
    const lab=sc>=3?['Bullish','up']:sc<=-3?['Bearish','dn']:['Mixed','gd'];
    const prev=cl[last-1],chg=(p/prev-1)*100;
    return {s,p,chg,e,d,sc,lab,e200:es[3][last]};
  }).filter(r=>!sigNear||Math.abs(r.d)<=2);
}
function sigBody(){
  const T=TF[sigTf];
  return sigRows().map(r=>`<tr class="cl ${r.s===sigPick?'sel':''}" data-s="${r.s}"><td class="t"><b>${r.s}</b></td><td>${fmt(r.p)}</td><td class="${r.chg>=0?'up':'dn'}">${pct(r.chg)}</td><td class="${r.d>=0?'up':'dn'}" style="${Math.abs(r.d)<=2?'background:#2a1a0c;color:#fdba74':''}">${fmt(r.e)} (${pct(r.d)})</td><td>${fmt(r.e200)}</td><td class="${r.lab[1]}">${r.sc>0?'+':''}${r.sc}</td><td class="t ${r.lab[1]}"><b>${r.lab[0]}</b></td></tr>`).join('')||'<tr><td class="t" colspan="7">No coins are within 2% of this EMA right now.</td></tr>';
}
V.sig=()=>{
  const T=TF[sigTf];
  return `<div class="vh"><h2>Signal Scanner</h2><p>Scores each coin from several indicators on daily, weekly or monthly charts. This demo uses a simplified score. The real scanner also reads RSI, Fibonacci zones and divergences. The Price column is live.</p></div>
  <div class="row"><label class="note">Timeframe <select id="stf"><option value="D">Daily</option><option value="W">Weekly</option><option value="M">Monthly</option></select></label>
   <label class="note" style="color:#fb923c">EMA <select id="sem">${T.per.map((p,i)=>`<option value="${i}">${p}-${T.u} EMA</option>`).join('')}</select></label>
   <button class="chip ${sigNear?'on':''}" id="snr">Near ${T.per[sigEma]} EMA</button></div>
  <div class="tw"><table><thead><tr><th>Token</th><th>Price</th><th>Change</th><th style="color:#fb923c">${T.per[sigEma]}-${T.u} EMA</th><th>${T.per[3]}-${T.u} EMA</th><th>Score</th><th>Signal</th></tr></thead><tbody id="sb">${sigBody()}</tbody></table></div>
  <div class="box" style="margin-top:14px"><h3 id="sct">${sigPick}</h3><canvas id="scv"></canvas><p class="note" style="margin-top:6px">Click any row to chart it. The orange line is the EMA you picked.</p></div>`;
};
V.sig.after=()=>{
  $('stf').value=sigTf;$('sem').value=sigEma;
  const chartIt=()=>{const T=TF[sigTf],cl=ser(sigPick,sigTf).slice();cl[cl.length-1]=price(sigPick);const es=T.per.map(p=>ema(cl,p));$('sct').textContent=sigPick+' · '+T.name;chart($('scv'),cl,es,sigEma,`${T.per[sigEma]}-${T.u} EMA in orange`)};
  const bind=()=>{$('sb').querySelectorAll('tr.cl').forEach(r=>r.onclick=()=>{sigPick=r.dataset.s;$('sb').innerHTML=sigBody();bind();chartIt()})};
  $('stf').onchange=e=>{sigTf=e.target.value;if(sigEma>3)sigEma=0;go('sig',true)};
  $('sem').onchange=e=>{sigEma=+e.target.value;go('sig',true)};
  $('snr').onclick=()=>{sigNear=!sigNear;go('sig',true)};
  bind();chartIt();window.onresize=chartIt;
  V.sig.tick=()=>{if($('sb')){$('sb').innerHTML=sigBody();bind()}};
};

V.ind=()=>{
  const T=TF.D;
  const rows=COINS.map(c=>{const s=c[0],cl=ser(s,'D'),es=T.per.map(p=>ema(cl,p)),l=cl.length-1;
    const cells=es.map(e=>{const above=cl[l]>e[l],was=cl[l-1]>e[l-1],nw=above!==was;return `<td class="${above?'up':'dn'}">${above?'▲':'▼'} ${pct((cl[l]/e[l]-1)*100)}${nw?' <span class="tag med">new</span>':''}</td>`}).join('');
    return `<tr><td class="t"><b>${s}</b></td>${cells}</tr>`}).join('');
  return `<div class="vh"><h2>Indicators and alerts</h2><p>Watches the Top 25, 50 or 100 coins, plus any ticker or contract address you add, and fires an alert when a daily candle closes across an EMA. The candle still forming is ignored, so a wick never causes a false alarm. "new" means it crossed on the latest daily close.</p></div>
  <div class="tw"><table><thead><tr><th>Coin</th><th>20 EMA</th><th>50 EMA</th><th>100 EMA</th><th>200 EMA</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="row"><button class="chip" id="fire">Fire a demo EMA alert</button><span class="note">Real alerts also cover RSI divergence, perp liquidations and health factor.</span></div>`;
};
V.ind.after=()=>{$('fire').onclick=()=>{const c=COINS[Math.floor(Math.random()*COINS.length)][0],p=[20,50,100,200][Math.floor(Math.random()*4)];pushAlert('EMA cross',`<b>${c}</b> closed above its ${p}-day EMA on the daily chart.`);toast('Alert sent to the feed.')}};

V.heat=()=>{
  const tiles=HEAT.map((c,i)=>{const v=HV[heatP][i],a=Math.min(1,Math.abs(v)/10),bg=v>=0?`rgba(82,211,154,${.35+a*.65})`:`rgba(229,88,76,${.35+a*.65})`;return `<button class="tile" data-i="${i}" style="--w:${heatM==='cap'?c[1]*2.4:24}%;background:${bg}"><b>${c[0]}</b><span>${pct(v)}</span></button>`}).join('');
  return `<div class="vh"><h2>Heat Map</h2><p>The top coins as colored tiles: green is up, red is down. Choose the period and what sets the tile size. Click a tile for details.</p></div>
  <div class="row"><span class="note">Period</span>${Object.keys(HV).map(k=>`<button class="chip ${k===heatP?'on':''}" data-p="${k}">${k}</button>`).join('')}<span class="note">Size by</span><button class="chip ${heatM==='cap'?'on':''}" data-m="cap">Market cap</button><button class="chip ${heatM==='eq'?'on':''}" data-m="eq">Equal</button></div>
  <div class="heat">${tiles}</div><div class="hp" id="hd">Click a tile to see its details.</div>`;
};
V.heat.after=()=>{
  $('stage').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{heatP=b.dataset.p;go('heat',true)});
  $('stage').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{heatM=b.dataset.m;go('heat',true)});
  $('stage').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,v=HV[heatP][i];$('hd').innerHTML=`<b>${HEAT[i][0]}</b>: ${pct(v)} over ${heatP}. Market cap weight ${HEAT[i][1]} of 103.`});
};

V.trend=()=>{
  const chains=['All chains',...new Set(TRENDS.map(t=>t[1]))];
  const rows=TRENDS.filter(t=>t[2]>=trendMin&&(trendChain==='All chains'||t[1]===trendChain)).map((t,i)=>{const r=t[2]<100000?['High','dn']:t[2]<1000000?['Medium','gd']:['Lower','up'];return `<tr><td class="t">${i+1}</td><td class="t"><b>${t[0]}</b></td><td class="t">${t[1]}</td><td class="up">${t[3]}</td><td>${money(t[2])}</td><td class="t ${r[1]}">${r[0]}</td></tr>`}).join('')||'<tr><td class="t" colspan="6">No tokens pass these filters.</td></tr>';
  return `<div class="vh"><h2>Trending Coins</h2><p>The real tool merges the trending lists from GeckoTerminal and DexScreener, ranks the top 10 and rescans every 10 minutes. Trending does not mean safe: new tokens are often scams, so check liquidity first. These tokens are made up.</p></div>
  <div class="row"><label class="note">Chain <select id="tch">${chains.map(c=>`<option ${c===trendChain?'selected':''}>${c}</option>`).join('')}</select></label><label class="note">Min liquidity <input type="range" id="tml" min="0" max="5000000" step="50000" value="${trendMin}"> <b class="mono" id="tmv">${money(trendMin)}</b></label></div>
  <div class="tw"><table><thead><tr><th>#</th><th>Token</th><th>Chain</th><th>24h</th><th>Liquidity</th><th>Exit risk</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};
V.trend.after=()=>{$('tch').onchange=e=>{trendChain=e.target.value;go('trend',true)};$('tml').onchange=e=>{trendMin=+e.target.value;go('trend',true)};$('tml').oninput=e=>{$('tmv').textContent=money(+e.target.value)}};

V.news=()=>{
  const list=NEWS.filter(n=>newsLvl==='all'||(newsLvl==='med'&&n[2]!=='low')||(newsLvl==='high'&&n[2]==='high'));
  return `<div class="vh"><h2>News that may swing price</h2><p>Headlines are scored by what that kind of story usually does to the market. Security events score highest, then regulation and macro, then listings, unlocks and flows. It is a keyword filter to help you triage, not a forecast, so open the story before you act. These headlines are made up.</p></div>
  <div class="row"><button class="chip ${newsLvl==='all'?'on':''}" data-n="all">All stories</button><button class="chip ${newsLvl==='med'?'on':''}" data-n="med">Medium and high</button><button class="chip ${newsLvl==='high'?'on':''}" data-n="high">High only</button></div>
  <div class="box">${list.map(n=>`<div class="li"><span><span class="tag ${n[2]}">${n[2]==='high'?'High':n[2]==='med'?'Medium':'Low'}</span><span class="tag">${n[1]}</span>${n[0]}</span><span class="mono ${n[3]==='bull'?'up':'dn'}" style="white-space:nowrap">${n[3]==='bull'?'▲':'▼'} <span class="mu">${n[4]}</span></span></div>`).join('')}</div>
  <div class="row"><button class="chip" id="nf">Send a high-impact story to the alert feed</button></div>`;
};
V.news.after=()=>{$('stage').querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{newsLvl=b.dataset.n;go('news',true)});$('nf').onclick=()=>{pushAlert('News','<b>High impact:</b> '+NEWS[0][0]);toast('Alert sent to the feed.')}};

/* ================= router ================= */
function buildNav(){
  $('nav').innerHTML=NAV.map(g=>`<h6>${g[0]}</h6>`+g[1].map(t=>`<button data-go="${t[0]}" class="${cur===t[0]?'cur':''}">${t[1]}${t[2]?'<span class="lk">Members</span>':''}</button>`).join('')).join('');
}
function go(id,keep){
  if(LOCK[id]){$('dt').textContent=LOCK[id][0];$('dp').textContent=LOCK[id][1]+' This tool is included with membership.';$('dlg').showModal();return}
  window.onresize=null;V.sig.tick=null;
  cur=id;buildNav();$('stage').innerHTML=V[id]();if(V[id].after)V[id].after();
  $('nav').classList.remove('open');if(!keep)window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  if(e.target.closest('[data-feed]')){$('feed').classList.add('open');unread=0;drawFeed()}
});
$('dc').onclick=()=>$('dlg').close();
$('menuBtn').onclick=()=>$('nav').classList.toggle('open');
$('reset').onclick=()=>{shock=0;usdx=1;lastStat={};alerts=[];unread=0;seed();go(cur,true);toast('Demo reset.')};

/* ================= live ticker ================= */
function drawTape(){const h=COINS.map(c=>`<span><b>${c[0]}</b>${fmt(price(c[0]))}</span>`).join('');$('trk').innerHTML=h+h}
function tick(){
  COINS.forEach(c=>{jit[c[0]]=Math.max(-.03,Math.min(.03,jit[c[0]]+(Math.random()-.5)*.0016))});
  drawTape();
  if(cur==='ovr'){const y=window.scrollY;$('stage').innerHTML=V.ovr();window.scrollTo(0,y)}
  if(cur==='sig'&&V.sig.tick)V.sig.tick();
}
function seed(){
  ACCTS.forEach(a=>lastStat[a.n]=stat(hf(a))[0]);
  pushAlert('Health factor','<b>Demo DSA B</b> (Avalanche): health factor is close to your caution line.',true);
  pushAlert('Peg','<b>USDe</b> is 0.09% off its peg. Normal wobble.',true);
  pushAlert('EMA cross','<b>SOL</b> closed above its 50-day EMA on the daily chart.',true);
}
seed();drawTape();go('ovr');
setInterval(tick,reduce?8000:2500);
</script>
